<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="아기 기록">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>아기 기록</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--txt:#e8eaed;--sub:#9aa0a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px}
body{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 40px)}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
header h1{font-size:21px;margin:0;flex:1}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#666}
.status{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.status::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 11px;min-width:128px}
.st span{font-size:12px;color:var(--sub)}.st b{display:block;font-size:17px;margin:2px 0}.st small{font-size:11px;color:var(--sub)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;overflow:hidden}
.tb::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.tb .e{font-size:26px;line-height:1.2}.tb .n{font-weight:700;font-size:14px}.tb .s{font-size:11px;color:var(--sub);white-space:nowrap}
.tb.on{border-color:var(--c);animation:pulse 1.8s infinite}
.tb:active{transform:scale(.96)}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--c) inset}}
.tabs{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:10px}
.tabs button{flex:1;background:none;border:0;color:var(--sub);padding:8px;border-radius:8px;font-weight:600}
.tabs button.a{background:#2a2f3a;color:var(--txt)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nav button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.nav button:disabled{opacity:.3}
.nav-t{flex:1;text-align:center;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.lg{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:12px}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.lg.off{opacity:.35;text-decoration:line-through}
.chartwrap{touch-action:pan-y}
.chartwrap svg{display:block;font-family:inherit}
.btn{background:#2a2f3a;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:#FFD54A;color:#111}.btn.red{background:#5a2328;color:#ffb4b4}.btn.wide{width:100%;margin-bottom:10px}
.lh{font-size:13px;color:var(--sub);margin:14px 2px 6px;font-weight:600}
.li{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:9px 11px;margin-bottom:5px}
.li i{width:6px;align-self:stretch;border-radius:3px}
.lm{flex:1}.lt{font-size:12px;color:var(--sub);margin-top:2px}.v{color:#ffd54a}.nt{color:var(--sub);font-size:13px}
.empty{text-align:center;color:var(--sub);padding:30px}
.sec{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
.sec h3{margin:0 0 10px;font-size:15px}
.fld{display:block;margin-bottom:9px}.fld span{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;background:#0f1115;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:16px}
.hint{font-size:12px;color:var(--sub);margin:6px 0;line-height:1.5;white-space:pre-line}
.tcard{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.tcard.dis{opacity:.5}
.trow{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.trow input,.trow select{background:#0f1115;border:1px solid var(--line);border-radius:7px;padding:6px;font-size:15px;min-width:0}
.trow input[type=checkbox]{width:22px;height:22px;flex:0 0 22px}
.trow .emo{width:44px;text-align:center}.trow .nm{flex:1}.trow input[type=color]{width:40px;height:34px;padding:2px}
.trow .unit{width:56px}.trow .tags{flex:1}
.ib{background:#2a2f3a;border:0;border-radius:7px;width:32px;height:32px;flex:0 0 32px}
.cr{display:flex;gap:6px;align-items:center;margin:4px 0;font-size:12px}
.cr span{width:44px;color:var(--sub)}.cr code{flex:1;background:#0f1115;padding:5px 7px;border-radius:6px;word-break:break-all;font-size:12px}
.cr button{background:#2a2f3a;border:0;border-radius:6px;padding:5px 8px;font-size:12px}
.sc{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.sct{font-weight:600;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:#2a2f3a;border:0;border-radius:18px;padding:7px 13px;font-size:14px}
.chip.big{padding:11px 16px;font-size:16px;font-weight:600}
.chip.ghost{background:none;border:1px solid #3a404c}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#1a1d24;width:100%;border-radius:16px 16px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);max-height:88vh;overflow:auto}
.sheet-h{display:flex;align-items:center;font-weight:700;font-size:17px;margin-bottom:10px}
.sheet-h div{flex:1}.x{background:none;border:0;font-size:18px;color:var(--sub)}
.sheet-a{display:flex;gap:8px;margin-top:6px}.sheet-a .btn{flex:1;padding:13px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:#262b35;border:1px solid #39404d;border-radius:14px;padding:11px 13px;z-index:30;transform:translateY(160%);transition:transform .25s}
#toast.show{transform:none}
.tm{font-weight:600}.tr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tr .chip{padding:6px 12px}
.ver{text-align:center;color:#555b66;font-size:11px;margin-top:10px}
</style>
</head>
<body>
<header><h1 id="title">아기 기록</h1><div class="sync"><span class="dot" id="dot"></span><span id="synctxt">로컬</span></div></header>
<div class="status" id="status"></div>
<div class="btns" id="btns"></div>
<div class="tabs"><button data-t="chart" class="a">차트</button><button data-t="list">목록</button><button data-t="settings">설정</button></div>
<div id="panel"></div>
<div id="toast"></div>
<script>
const APP_VERSION='v1.0';
const DEFAULT_TYPES=[
 {id:'breast',name:'모유수유',emoji:'🤱',color:'#FFD54A',kind:'duration',enabled:true,feed:true,tags:['왼쪽','오른쪽','양쪽']},
 {id:'formula',name:'분유',emoji:'🍼',color:'#FF9F43',kind:'point',enabled:true,feed:true,unit:'ml',presets:[20,40,60,80,100,120]},
 {id:'diaper',name:'기저귀',emoji:'💧',color:'#4DA3FF',kind:'point',enabled:true,tags:['소변','대변','둘다']},
 {id:'sleep',name:'수면',emoji:'😴',color:'#9B7BFF',kind:'duration',enabled:true},
 {id:'bath',name:'목욕',emoji:'🛁',color:'#FFFFFF',kind:'point',enabled:false},
 {id:'temp',name:'체온',emoji:'🌡️',color:'#FF6B6B',kind:'point',enabled:false,unit:'°C',presets:[36.5,36.8,37.0,37.5]},
 {id:'vitamin',name:'비타민',emoji:'💊',color:'#4CD97B',kind:'point',enabled:false},
 {id:'tummy',name:'터미타임',emoji:'🐢',color:'#2EC4B6',kind:'duration',enabled:false},
 {id:'etc',name:'기타',emoji:'📝',color:'#9AA0A6',kind:'point',enabled:false,askNote:true},
 {id:'recA',name:'기록A',emoji:'🅰️',color:'#FF7EB6',kind:'point',enabled:false},
 {id:'recB',name:'기록B',emoji:'🅱️',color:'#7EE0FF',kind:'point',enabled:false}
];
const WD=['일','월','화','수','목','금','토'];
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function h(tag,attrs,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')el.className=v;else if(k==='style')el.style.cssText=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)el.setAttribute(k,v===true?'':v)}for(const c of kids.flat(3)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c))}return el}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtHM=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtMD=d=>{d=new Date(d);return (d.getMonth()+1)+'/'+d.getDate()};
const toLocalInput=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
function ago(ms){const m=Math.max(0,Math.floor(ms/6e4)),hh=Math.floor(m/60);return hh?`${hh}시간 ${m%60}분`:`${m}분`}
function agoS(ms){const m=Math.max(0,Math.floor(ms/6e4)),hh=Math.floor(m/60);return hh?`${hh}:${pad(m%60)}`:`${m}분`}
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'l'+Date.now().toString(36)+Math.random().toString(36).slice(2));

let dev=LS.get('bl_dev',{url:'',key:'',code:'',who:''});
let config=mergeDefaults(LS.get('bl_config',null)||{babyName:'',types:JSON.parse(JSON.stringify(DEFAULT_TYPES))});
let events=[],weekOffset=0,tab='chart',hidden=new Set(LS.get('bl_hidden',[]));
function mergeDefaults(c){c.types=c.types||[];const ids=new Set(c.types.map(t=>t.id));DEFAULT_TYPES.forEach(d=>{if(!ids.has(d.id))c.types.push({...d,enabled:false})});return c}
const T=id=>config.types.find(t=>t.id===id)||{id,name:id,emoji:'•',color:'#888',kind:'point'};
const firstEnabled=()=>config.types.find(t=>t.enabled)||config.types[0];
const isOpen=e=>T(e.type).kind==='duration'&&!e.end_at&&(Date.now()-new Date(e.start_at))<864e5;
const remote=()=>!!(dev.url&&dev.key&&dev.code);

async function rpc(fn,args){
 const hd={'apikey':dev.key,'Content-Type':'application/json'};
 if(dev.key.startsWith('eyJ'))hd.Authorization='Bearer '+dev.key;
 const r=await fetch(dev.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:hd,body:JSON.stringify(args)});
 const t=await r.text();
 if(!r.ok){let m=t;try{m=JSON.parse(t).message||t}catch(e){}throw new Error(m)}
 return t?JSON.parse(t):null;
}
const localAll=()=>LS.get('bl_events',[]);
const store={
 async list(from,to){
  if(remote())return (await rpc('list_events',{p_code:dev.code,p_from:from.toISOString(),p_to:to.toISOString()}))||[];
  const now=Date.now();
  return localAll().filter(e=>{const a=+new Date(e.start_at);let b=e.end_at?+new Date(e.end_at):(isOpen(e)?now:a);return a<+to&&b>=+from});
 },
 async add(e){
  if(remote())return rpc('add_event',{p_code:dev.code,p_type:e.type,p_start:e.start_at,p_end:e.end_at||null,p_value:e.value??null,p_note:e.note||null,p_by:dev.who||null});
  const all=localAll();const n={id:uid(),end_at:null,value:null,note:null,created_by:dev.who||null,...e};all.push(n);LS.set('bl_events',all);return n;
 },
 async toggle(type){
  if(remote())return rpc('toggle_event',{p_code:dev.code,p_type:type,p_by:dev.who||null});
  const all=localAll();const open=all.filter(e=>e.type===type&&isOpen(e)).sort((a,b)=>new Date(b.start_at)-new Date(a.start_at))[0];
  if(open){open.end_at=new Date().toISOString();LS.set('bl_events',all);return {action:'stop',event:open}}
  return {action:'start',event:await store.add({type,start_at:new Date().toISOString()})};
 },
 async update(e){
  if(remote())return rpc('update_event',{p_code:dev.code,p_id:e.id,p_type:e.type,p_start:e.start_at,p_end:e.end_at||null,p_value:e.value??null,p_note:e.note||null});
  const all=localAll();const i=all.findIndex(x=>x.id===e.id);if(i>=0)all[i]={...all[i],...e};LS.set('bl_events',all);return all[i];
 },
 async remove(id){
  if(remote())return rpc('delete_event',{p_code:dev.code,p_id:id});
  LS.set('bl_events',localAll().filter(e=>e.id!==id));
 },
 async bulk(rows){
  if(remote())return rpc('import_events',{p_code:dev.code,p_rows:rows});
  const all=localAll();rows.forEach(r=>all.push({id:uid(),end_at:null,value:null,note:null,created_by:null,...r}));LS.set('bl_events',all);return rows.length;
 },
 async all(){
  if(remote())return (await rpc('list_events',{p_code:dev.code,p_from:'2000-01-01T00:00:00Z',p_to:'2100-01-01T00:00:00Z'}))||[];
  return localAll();
 }
};
async function loadConfig(){
 if(!remote())return;
 try{const c=await rpc('get_config',{p_code:dev.code});
  if(c&&c.types&&c.types.length){config=mergeDefaults(c);LS.set('bl_config',config)}
  else await rpc('set_config',{p_code:dev.code,p_data:config});
 }catch(e){setSync('err',e.message)}
}
async function saveConfig(){LS.set('bl_config',config);if(remote())await rpc('set_config',{p_code:dev.code,p_data:config})}

function setSync(s,msg){
 $('#dot').style.background=s==='ok'?'#4CD97B':s==='err'?'#FF6B6B':'#666';
 $('#synctxt').textContent=s==='ok'?'동기화':s==='err'?'연결 오류':'로컬';
 $('#synctxt').title=msg||'';
}
function weekRange(){const end=addDays(dayStart(new Date()),1-7*weekOffset);return {start:addDays(end,-7),end}}
let refreshing=0;
async function refresh(){
 const my=++refreshing;const {start,end}=weekRange();const now=Date.now();
 const from=new Date(Math.min(+start,now-3*864e5)),to=new Date(Math.max(+end,now+36e5));
 try{const ev=await store.list(from,to);if(my!==refreshing)return;events=ev;setSync(remote()?'ok':'local')}
 catch(e){setSync('err',e.message)}
 renderAll();
}
function renderAll(){
 $('#title').textContent=config.babyName?`${config.babyName} 기록`:'아기 기록';
 renderLive();if(tab!=='settings')renderTab();
}
function renderLive(){renderStatus();renderButtons()}
function card(title,big,sub,color){return h('div',{class:'st',style:`border-left:3px solid ${color}`},h('span',{},title),h('b',{},big),sub?h('small',{},sub):null)}
function renderStatus(){
 const now=Date.now(),s=[...events].sort((a,b)=>new Date(b.start_at)-new Date(a.start_at)),cards=[];
 s.filter(isOpen).forEach(e=>{const t=T(e.type);cards.push(card(`${t.emoji} ${t.name} 중`,ago(now-new Date(e.start_at)),`${fmtHM(e.start_at)} 시작`,t.color))});
 const f=s.find(e=>T(e.type).feed);
 if(f){const t=T(f.type);cards.push(card('마지막 수유',ago(now-new Date(f.start_at))+' 전',`${t.emoji} ${t.name} ${fmtHM(f.start_at)}${f.value!=null?' · '+f.value+(t.unit||''):''}`,t.color))}
 const d=s.find(e=>e.type==='diaper');
 if(d){const t=T('diaper');cards.push(card('마지막 기저귀',ago(now-new Date(d.start_at))+' 전',`${fmtHM(d.start_at)}${d.note?' · '+d.note:''}`,t.color))}
 if(!cards.length)cards.push(card('시작하기','아래 버튼을 눌러요','','#555'));
 $('#status').replaceChildren(...cards);
}
function renderButtons(){
 const now=Date.now();
 $('#btns').replaceChildren(...config.types.filter(t=>t.enabled).map(t=>{
  const open=events.find(e=>e.type===t.id&&isOpen(e));
  const last=events.filter(e=>e.type===t.id).sort((a,b)=>new Date(b.start_at)-new Date(a.start_at))[0];
  const sub=open?`진행 중 ${agoS(now-new Date(open.start_at))}`:last?`${fmtHM(last.start_at)} (${agoS(now-new Date(last.start_at))} 전)`:(t.kind==='duration'?'탭: 시작':'탭: 기록');
  return h('button',{class:'tb'+(open?' on':''),style:`--c:${t.color}`,onclick:()=>onTap(t)},h('span',{class:'e'},t.emoji),h('span',{class:'n'},open?`${t.name} 끝`:t.name),h('span',{class:'s'},sub));
 }));
}
async function onTap(t){
 try{
  if(t.kind==='duration'){
   const r=await store.toggle(t.id);const ev=r.event;await refresh();
   toast(`${t.emoji} ${t.name} ${r.action==='start'?'시작':'종료'} ${fmtHM(new Date())}${r.action==='stop'?' · '+ago(new Date(ev.end_at)-new Date(ev.start_at)):''}`,
    {tags:t.tags,ev,undo:async()=>{if(r.action==='start')await store.remove(ev.id);else await store.update({...ev,end_at:null});await refresh()}});
   return;
  }
  if(t.unit||t.askNote){openQuick(t);return}
  const ev=await store.add({type:t.id,start_at:new Date().toISOString()});await refresh();
  toast(`${t.emoji} ${t.name} 기록 ${fmtHM(ev.start_at)}`,{tags:t.tags,ev,undo:async()=>{await store.remove(ev.id);await refresh()}});
 }catch(e){alert('기록 실패: '+e.message)}
}
let toastTimer;
function hideToast(){$('#toast').classList.remove('show')}
function toast(msg,o={}){
 const el=$('#toast');el.replaceChildren(h('div',{class:'tm'},msg));const row=h('div',{class:'tr'});
 if(o.tags&&o.ev)o.tags.forEach(g=>row.append(h('button',{class:'chip',onclick:async()=>{o.ev.note=g;try{await store.update(o.ev);await refresh();toast(`메모 '${g}' 저장됨`)}catch(e){alert(e.message)}}},g)));
 if(o.ev)row.append(h('button',{class:'chip ghost',onclick:()=>{hideToast();openEdit(o.ev,false)}},'수정'));
 if(o.undo)row.append(h('button',{class:'chip ghost',onclick:async()=>{hideToast();try{await o.undo();toast('취소됨')}catch(e){alert(e.message)}}},'취소'));
 if(row.children.length)el.append(row);
 el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,o.tags?9000:4500);
}
function closeSheet(){document.querySelectorAll('.sheet-bg').forEach(x=>x.remove())}
function sheet(title,body,actions){
 closeSheet();
 const bg=h('div',{class:'sheet-bg'},h('div',{class:'sheet'},h('div',{class:'sheet-h'},h('div',{},title),h('button',{class:'x',onclick:closeSheet},'✕')),body,h('div',{class:'sheet-a'},actions)));
 bg.addEventListener('click',e=>{if(e.target===bg)closeSheet()});document.body.append(bg);
}
const field=(label,input)=>h('label',{class:'fld'},h('span',{},label),input);
function openQuick(t){
 const last=events.filter(e=>e.type===t.id&&e.value!=null).sort((a,b)=>new Date(b.start_at)-new Date(a.start_at))[0];
 const val=h('input',{type:'number',step:'any',inputmode:'decimal',placeholder:t.unit||'',value:last?last.value:''});
 const note=h('input',{type:'text',placeholder:'메모 (선택)'});
 const tm=h('input',{type:'datetime-local',value:toLocalInput(new Date())});
 const save=async v=>{try{
  const ev=await store.add({type:t.id,start_at:new Date(tm.value).toISOString(),value:(v===''||v==null)?null:Number(v),note:note.value||null});
  closeSheet();await refresh();
  toast(`${t.emoji} ${t.name} 기록 ${fmtHM(ev.start_at)}${ev.value!=null?' · '+ev.value+(t.unit||''):''}`,{ev,undo:async()=>{await store.remove(ev.id);await refresh()}});
 }catch(e){alert('기록 실패: '+e.message)}};
